name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate env example
        run: python scripts/validate_env.py --mode example .env.example

      - name: Validate repo structure
        run: python scripts/validate_repo_structure.py

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Compile Python helper scripts
        run: python -m compileall scripts

      - name: Check for accidental whitespace changes
        run: git diff --check
